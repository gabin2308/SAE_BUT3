# Environnement de DÉVELOPPEMENT uniquement.
# En production (Render), pas de docker-compose : on utilise DATABASE_URL.
services:
  db:
    image: pgvector/pgvector:pg16        # PostgreSQL 16 + extension pgvector
    container_name: sae_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/database:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: sae_backend
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload   # adapte à ton framework
    env_file:
      - .env
    environment:
      # Dans le réseau Docker, la base s'appelle "db" et écoute sur 5432.
      # Ces valeurs écrasent celles du .env (prévues pour un lancement hors Docker).
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DB_NAME: ${POSTGRES_NAME}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: ""                    # vide : Settings reconstruit le DSN depuis POSTGRES_*
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: